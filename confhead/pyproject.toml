[project]
name = "confhead"
version = "0.1.0"
description = "A per-pixel confidence head for the depth of a frozen Depth Anything V2, on nuScenes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pillow>=10.0",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
