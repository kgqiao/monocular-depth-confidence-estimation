# nuScenes v1.0-mini: 10 scenes, 404 keyframes, 2424 camera images.
# Every setting and its default is in src/confcache/config.py.
# `uv run confcache config` prints the result of this file and any --set.

[source]
kind = "nuscenes"
dataroot = "../../../datasets/nuscenes/v1.0-mini"
version = "v1.0-mini"
cameras = ["CAM_FRONT_LEFT", "CAM_FRONT", "CAM_FRONT_RIGHT", "CAM_BACK_LEFT", "CAM_BACK", "CAM_BACK_RIGHT"]
scenes = []
max_samples_per_scene = 0

[model]
checkpoint = ""  # empty: $DEPTH_ANYTHING_CHECKPOINT
encoder = "vitb"
short_side = 518
tap = "output_conv1"

[grid]
patch_multiple = 4

[temporal]
enabled = true
offsets = [-2, -1, 1, 2]
align = "lidar"
min_fit_points = 20
min_overlap = 0.3
keep_neighbors = false

[points]
min_depth = 1.0
max_depth = 80.0
lidar_sweeps = 1
radar_sweeps = 5

[output]
root = "../outputs/cache/nuscenes-mini"
feature_dtype = "float16"
store_full_disparity = true
compress = false

[run]
device = "auto"
precision = "fp32"
batch_size = 10
num_workers = 4
writer_threads = 2
log_every = 25

# The official mini split of the nuScenes devkit (splits.py: mini_train, mini_val).
[splits]
train = ["scene-0061", "scene-0553", "scene-0655", "scene-0757", "scene-0796", "scene-1077", "scene-1094", "scene-1100"]
val = ["scene-0103", "scene-0916"]
