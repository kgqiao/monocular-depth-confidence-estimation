[project]
name = "confcache"
version = "0.1.0"
description = "Cache the frozen Depth Anything V2 outputs that train the depth confidence head."
requires-python = ">=3.12,<3.13"
dependencies = [
    "confhead",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pillow>=10.0",
    "torch>=2.4",
]

[project.scripts]
confcache = "confcache.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
confhead = { path = "../../pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confcache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
