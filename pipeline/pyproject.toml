[project]
name = "confhead"
version = "0.1.0"
description = "Proof of concept for the per-pixel depth confidence head on nuScenes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
]

[project.scripts]
confhead = "confhead.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
